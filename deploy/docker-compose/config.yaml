database:
  db_source: postgresql://root:secret@postgresd:5432/time_keeper?sslmode=disable
  db_name: time_keeper
server:
  address: 0.0.0.0:8080
  secure_cookies: ${SECURE_COOKIES:-false}
  enable_swagger: ${ENABLE_SWAGGER:-false}
logto:
  endpoint: http://logto:3001
  app_id: ${LOGTO_APP_ID}
  app_secret: ${LOGTO_APP_SECRET}
  callback_url: http://localhost:8080/auth/callback
