version: '3'

env:
  DB_URL: 'postgresql://root:secret@localhost:5432/time_keeper?sslmode=disable'
  COMPOSE_FILE: 'deploy/docker-compose/quickstart.yaml'

tasks:
  # ── Migrations ──────────────────────────────────────────────────────────────
  migrateup:
    desc: run migrations up
    cmds:
      - go run ./main.go migrate up

  migratedown:
    desc: run migrations down 1 step
    cmds:
      - go run ./main.go migrate down 1

  new_migration:
    desc: create a new migration file (use -- name=<name>)
    cmds:
      - migrate create -ext sql -dir internal/repository/db/migrations -seq {{.name}}

  sqlc:
    desc: generate sqlc code from queries
    cmds:
      - sqlc generate

  # ── Code generation ─────────────────────────────────────────────────────────
  templ:
    desc: generate Go code from .templ files
    cmds:
      - templ generate

  tailwind:
    desc: build Tailwind CSS (one-shot, minified)
    cmds:
      - tailwindcss -i static/css/input.css -o static/css/output.css --minify

  tailwind-watch:
    desc: build Tailwind CSS and watch for changes (dev mode)
    cmds:
      - tailwindcss -i static/css/input.css -o static/css/output.css --watch

  generate:
    desc: run all code generators (templ + tailwind)
    cmds:
      - task: templ
      - task: tailwind

  api_doc:
    desc: generate swagger documentation
    cmds:
      - swag init -g ./main.go

  # ── Dev workflow ────────────────────────────────────────────────────────────
  services:
    desc: start external services via compose (postgres + logto)
    cmds:
      # Stop any standalone postgres container that would conflict on port 5432
      - podman stop time_keeper 2>/dev/null || true
      - podman compose -f $COMPOSE_FILE up -d postgresd logto-db logto logto-seed

  services-down:
    desc: stop external services (data volumes are preserved)
    cmds:
      - podman compose -f $COMPOSE_FILE down

  services-reset:
    desc: stop external services AND delete all data volumes (full reset)
    cmds:
      - podman compose -f $COMPOSE_FILE down -v

  server:
    desc: run the Go server locally (requires services running)
    cmds:
      - go run ./main.go serve

  dev:
    desc: start services + migrate + run server (full local dev stack)
    cmds:
      - task: services
      - task: migrateup
      - task: server

  # ── Full compose ────────────────────────────────────────────────────────────
  compose:
    desc: launch full stack via podman compose (postgres + logto + app)
    cmds:
      - podman compose -f $COMPOSE_FILE up --build

  compose-down:
    desc: stop and remove all compose containers (data volumes preserved)
    cmds:
      - podman compose -f $COMPOSE_FILE down

  # ── Tests ───────────────────────────────────────────────────────────────────
  test:
    desc: run all tests with coverage
    cmds:
      - go test -v -cover ./...
